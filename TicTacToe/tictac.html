<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="tictac.css">  <!-- Changed to match your file name -->
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="board">
        <div class="cell" id="cell-1" onclick="game.makeMove(1)"></div>
        <div class="cell" id="cell-2" onclick="game.makeMove(2)"></div>
        <div class="cell" id="cell-3" onclick="game.makeMove(3)"></div>
        <div class="cell" id="cell-4" onclick="game.makeMove(4)"></div>
        <div class="cell" id="cell-5" onclick="game.makeMove(5)"></div>
        <div class="cell" id="cell-6" onclick="game.makeMove(6)"></div>
        <div class="cell" id="cell-7" onclick="game.makeMove(7)"></div>
        <div class="cell" id="cell-8" onclick="game.makeMove(8)"></div>
        <div class="cell" id="cell-9" onclick="game.makeMove(9)"></div>
    </div>
    <div id="message"></div>
    <button onclick="restartGame()">Restart</button>
    <script src="tictac.js"></script>
</body>
</html>
