<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>Document</title>
</head>
<body>
    <div id="overallcontainer">
        <aside class = "sidestuff">
            <div class ="logo_holder">
                <img src="odin-logo.png" alt="">
                <p>ODIN</p>
            </div>
        </aside>
    <div class="form_container">
        <div id = "opening_text">
            <h3>This is not a real online service! You know you need something like this in youre
life, but this is just a practice project for me to learn how to make forms and style them.
            </h3><q>You know you want to </q>
        </div>
        <h2>Let's do this!</h2>
        <div id="form">
            <form action ="">
                <div id="name_inputs"> 
                    <label for ="username"> 
                        <span>Firstname</span>
                    </label>
                        <input type="text" name="username">
                    <label for ="lastname">
                        <span>Lastname</span>
                    </label>
                        <input type="text" name="lastname"> 
                </div>
                <div id="email_input">
                    <label for="email">
                        <span>Email</span>
                    </label>
                    <input type="email" name="email">
                    <label for="phone_number">
                        <span>Phone Number</span>
                    </label>
                    <input type="tel" name="phone_number">
                </div>
                <div id="password_input">
                    <label for="password">
                        <span>Password</span>
                    </label>
                    <input type="password" name="password">
                    <label for="confirm_password">
                        <span>Confirm Password</span>
                    </label>
                    <input type="password" name="confirm_password">
                </div>
            </form>
        </div>
        <div id="submit_button">
            <button type="submit">Create Account</button>
            <h3>Already have an account? <a href="#">Sign in</a></h3>
        </div>
    </div>
    </div>

</body>
</html>
